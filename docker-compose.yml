services:
  hh-proposal-backend-api:
    container_name: hh-proposal-backend-api
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - '8000:8000'
    depends_on:
      hh-proposal-backend-db:
        condition: service_healthy
    environment:
      - NODE_ENV=development
    command: npm start
    develop:
      watch:
        - action: sync
          path: ./
          target: /app/
          initial_sync: true
          ignore:
            - node_modules/

  hh-proposal-backend-db:
    container_name: hh-proposal-backend-db
    image: mysql:8.0.32
    environment:
      MYSQL_ROOT_PASSWORD: 1Nhfkjlek78
      MYSQL_DATABASE: hushaz_api
      MYSQL_USER: exesoft
      MYSQL_PASSWORD: feZkb86dab
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/sql/db-init-dev.sql:/docker-entrypoint-initdb.d/db-init-dev.sql:ro
    ports:
      - '3306:3306'
    command: --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
